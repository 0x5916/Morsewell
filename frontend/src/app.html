<!doctype html>
<html lang="%paraglide.lang%">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="application-name" content="Morsewell" />
    <meta name="apple-mobile-web-app-title" content="Morsewell" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#F4F4F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191B1C" media="(prefers-color-scheme: dark)" />
    <script>
      // Restore before CSS and hydration. Keys match UI_STORAGE_KEYS in storageKeys.ts.
      try {
        const theme = localStorage.getItem('theme');
        const palette = localStorage.getItem('palette');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
        }
        if (palette === 'warm' || palette === 'cool') {
          document.documentElement.dataset.palette = palette;
        }
      } catch {
        // Use the system appearance when the browser blocks storage.
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
    <script>
      // Align prerendered Settings radios with the first paint, before hydration.
      {
        const root = document.documentElement;
        const saved = {
          theme: root.dataset.theme || 'auto',
          palette: root.dataset.palette || 'neutral'
        };
        for (const radio of document.querySelectorAll('#preferences input[type=radio]')) {
          if (Object.hasOwn(saved, radio.name)) radio.checked = radio.value === saved[radio.name];
        }

        // Use the resolved canvas for the browser chrome, including live System changes.
        const metaColors = document.querySelectorAll('meta[name=theme-color]');
        const syncChrome = () => {
          const style = getComputedStyle(root);
          if (!style.getPropertyValue('--bg-base')) return;
          for (const meta of metaColors) meta.content = style.backgroundColor;
        };
        syncChrome();
        window.addEventListener('load', syncChrome, { once: true });
        new MutationObserver(syncChrome).observe(root, {
          attributes: true,
          attributeFilter: ['data-theme', 'data-palette']
        });
        matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncChrome);
      }
    </script>
  </body>
</html>
